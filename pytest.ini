[pytest]
# asyncio_mode = auto
# asyncio_default_fixture_loop_scope = "function"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configuring test output
console_output_style = progress
log_cli = true
log_cli_level = INFO

# Configuring test collection
norecursedirs = .git .pytest_cache __pycache__ venv
